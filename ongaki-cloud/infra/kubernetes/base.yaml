apiVersion: v1
kind: Namespace
metadata:
  name: ongaki-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-service
  namespace: ongaki-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ongaki-deployment-manager
rules:
  - apiGroups: [""]
    resources: ["namespaces", "services", "configmaps", "secrets", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["serving.knative.dev"]
    resources: ["services", "revisions", "routes", "configurations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "issuers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ongaki-deployment-manager
subjects:
  - kind: ServiceAccount
    name: deployment-service
    namespace: ongaki-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ongaki-deployment-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ongaki-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: deployment-service
      containers:
        - name: api-gateway
          image: registry.ongaki.cloud/system/api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: OTEL_EXPORTER_JAEGER_ENDPOINT
              value: http://jaeger-collector.observability:14268/api/traces
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ongaki-system
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sample-customer-api
  namespace: tenant-demo
  labels:
    ongaki.cloud/tenant: demo
    ongaki.cloud/project: sample-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/max-scale: "20"
        autoscaling.knative.dev/target: "100"
    spec:
      timeoutSeconds: 30
      containers:
        - image: registry.ongaki.cloud/demo/sample-api:2026-05-20T090000Z
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi

