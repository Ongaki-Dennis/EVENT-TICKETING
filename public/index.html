<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amsterdon ChatBot</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="chat-card" aria-label="Restaurant chatbot">
        <header class="chat-header">
          <div>
            <p class="eyebrow">Amsterdon</p>
            <h1>Restaurant ChatBot</h1>
          </div>
          <div class="status-pill">Online</div>
        </header>

        <section id="payment-banner" class="payment-banner" hidden></section>

        <section class="currency-bar">
          <label for="currency-select">Currency</label>
          <select id="currency-select"></select>
        </section>

        <section id="messages" class="messages" aria-live="polite"></section>

        <form id="chat-form" class="chat-form">
          <label class="sr-only" for="message-input">Send an option</label>
          <input
            id="message-input"
            maxlength="120"
            autocomplete="off"
            placeholder="Type 1, 99, 98, 97, 0..."
            required
          />
          <button type="submit">Send</button>
        </form>
      </section>

      <aside class="order-panel">
        <section>
          <div class="panel-heading">
            <p class="eyebrow">Current</p>
            <h2>Order</h2>
          </div>
          <div id="current-order" class="order-list"></div>
        </section>

        <section>
          <div class="panel-heading">
            <p class="eyebrow">Placed</p>
            <h2>History</h2>
          </div>
          <div id="order-history" class="order-list"></div>
        </section>
      </aside>
    </main>

    <dialog id="payment-dialog" class="payment-dialog">
      <form id="payment-form" method="dialog">
        <h2>Pay with Paystack</h2>
        <p id="payment-summary"></p>
        <label>
          Email address
          <input id="payment-email" type="email" placeholder="customer@example.com" required />
        </label>
        <menu>
          <button type="button" id="cancel-payment" class="secondary-button">Cancel</button>
          <button type="submit">Continue</button>
        </menu>
      </form>
    </dialog>

    <script src="/app.js"></script>
  </body>
</html>
